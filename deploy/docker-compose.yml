services:
  dbx:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env.example
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 4224"
    environment:
      - APP_PORT=4224
      - APP_STATIC_DIR=/app/static
      - DBX_DATA_DIR=/app/data
      - ENTERPRISE_INTERNAL_TOKEN=dbx-enterprise-internal
      - DBX_WEB_BASE_URL=http://dbx:4224
      - DBX_WEB_INTERNAL_TOKEN=dbx-enterprise-internal
      - OIDC_ENABLED=true
      - OIDC_MOCK_MODE=false
      - OIDC_PROVIDER_NAME=DBX Local Keycloak
      - OIDC_CLIENT_ID=dbx-web
      - OIDC_CLIENT_SECRET=dbx-web-secret
      - OIDC_AUTHORIZE_URL=http://localhost:8080/realms/dbx/protocol/openid-connect/auth
      - OIDC_TOKEN_URL=http://keycloak:8080/realms/dbx/protocol/openid-connect/token
      - OIDC_USERINFO_URL=http://keycloak:8080/realms/dbx/protocol/openid-connect/userinfo
      - OIDC_REDIRECT_URI=http://localhost:4224/api/v1/auth/callback
      - OIDC_POST_LOGOUT_REDIRECT_URI=http://localhost:4224/login
      - OIDC_LOGOUT_URL=http://localhost:8080/realms/dbx/protocol/openid-connect/logout
    ports:
      - "4224:4224"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - dbx-data:/app/data:ro
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dbx_enterprise
      POSTGRES_USER: dbx
      POSTGRES_PASSWORD: dbx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbx -d dbx_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  dbx-data:
