services:
  dbx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "4224:4224"
    environment:
      - DBX_ENTERPRISE_API_BASE_URL=http://dbx-enterprise-api:8000
      - DBX_ENTERPRISE_SESSION_COOKIE_NAME=dbx_enterprise_session
      - DBX_ENTERPRISE_INTERNAL_TOKEN=dbx-enterprise-internal
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped

  dbx-enterprise-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env.example
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DBX_WEB_BASE_URL=http://dbx:4224
      - DBX_WEB_INTERNAL_TOKEN=dbx-enterprise-internal
      - ENTERPRISE_INTERNAL_TOKEN=dbx-enterprise-internal
      - OIDC_REDIRECT_URI=http://localhost:4224/api/v1/auth/callback
      - OIDC_POST_LOGOUT_REDIRECT_URI=http://localhost:4224/login
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dbx_enterprise
      POSTGRES_USER: dbx
      POSTGRES_PASSWORD: dbx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbx -d dbx_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dbx-data:
  postgres-data:
