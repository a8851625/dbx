[project]
name = "dbx-enterprise-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for DBX enterprise edition"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pymysql>=1.1,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-json-logger>=2.0,<4.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "sqlparse>=0.5,<1.0",
  "cryptography>=42.0,<47.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.alembic]
script_location = "alembic"
prepend_sys_path = ["."]
